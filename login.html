<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iniciar sesión</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --carbon: #1C1B1A;
    --carbon-2: #262523;
    --red: #C8102E;
    --green: #2E7D32;
    --amber: #F5A623;
    --bone: #F2EFE9;
    --steel: #4A4E54;
    --steel-line: #38363430;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--carbon);
    color: var(--bone);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
  }

  .hazard-strip{
    height:6px;
    width:100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--amber) 0 14px,
      var(--carbon) 14px 28px
    );
    flex-shrink:0;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px 20px;
  }

  .login-card{
    width:100%;
    max-width: 380px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
    margin: 0 0 6px;
    text-align:center;
  }

  h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 24px;
    letter-spacing: 0.01em;
    margin:0 0 28px;
    text-transform: uppercase;
    text-align:center;
  }

  label{
    display:block;
    font-size: 12px;
    color: #C9C6BE;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input{
    width:100%;
    padding: 13px 14px;
    margin-bottom: 18px;
    background: var(--carbon-2);
    border: 1px solid var(--steel-line);
    border-radius: 3px;
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
  }
  input:focus{
    outline: 2px solid var(--amber);
    outline-offset: 0;
    border-color: transparent;
  }

  button.primary{
    width:100%;
    padding: 15px;
    background: var(--red);
    color: var(--bone);
    border:none;
    border-radius: 3px;
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor:pointer;
  }
  button.primary:active{ opacity: 0.85; }
  button.primary:disabled{ opacity: 0.5; cursor:not-allowed; }

  .error-msg{
    color: var(--red);
    font-size: 13px;
    margin: -10px 0 16px;
    display:none;
  }
  .error-msg.visible{ display:block; }

  .brand-footer{
    padding: 32px 20px 40px;
    display:flex;
    justify-content:center;
    opacity: 0.85;
  }
  .brand-footer img{
    max-width: 560px;
    width: 100%;
    height: auto;
  }

  .brand-top{
    padding: 20px 20px 4px;
    display:flex;
    justify-content:center;
  }
  .brand-top img{
    max-width: 240px;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div class="hazard-strip"></div>
<div class="brand-top"><img src="logo-catosa-top.png" alt="Catosa"></div>

<main>
  <div class="login-card">
    <p class="eyebrow">Inspección de extintores</p>
    <h1>Iniciar sesión</h1>

    <form id="loginForm">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">

      <label for="sucursal">Sucursal</label>
      <select id="sucursal" required>
        <option value="" disabled selected>Selecciona una sucursal</option>
        <option value="Torreón">Torreón</option>
        <option value="Gómez Palacio">Gómez Palacio</option>
        <option value="Piedras Negras">Piedras Negras</option>
        <option value="Monclova">Monclova</option>
      </select>

      <p class="error-msg" id="errorMsg"></p>

      <button type="submit" class="primary" id="btnLogin">Entrar</button>
    </form>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://naihctepfrnprudwfexj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_5rlhtpAIlwAbpz5Dgrwwbw_Kqur2RMS";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const btnLogin = document.getElementById('btnLogin');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('visible');
    btnLogin.disabled = true;
    btnLogin.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const sucursal = document.getElementById('sucursal').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorMsg.textContent = 'Correo o contraseña incorrectos.';
      errorMsg.classList.add('visible');
      btnLogin.disabled = false;
      btnLogin.textContent = 'Entrar';
      return;
    }

    window.location.href = `index.html?sucursal=${encodeURIComponent(sucursal)}`;
  });
</script>


<footer class="brand-footer">
  <img src="logo-catosa.png" alt="International - Catosa">
</footer>
</body>
</html>
